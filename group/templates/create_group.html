{% extends 'mbtbase.html' %}

{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/narrow.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>Create a New Group</h2>
    <form method="post" class="fleet-edit-wrapper" id="group-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="group_name">Group Name:</label>
            <input type="text" id="group_name" name="group_name" class="form-control" required>
        </div><br>

        <div class="form-group">
            <label for="order_by">Order Fleet By:</label>
            <select id="order_by" name="order_by" class="form-control">
                {% for choice in order_by_choices %}
                    <option value="{{ choice.0 }}">{{ choice.1 }}</option>
                {% endfor %}
            </select>
            <small class="create-link">Select how the fleet should be ordered within the group.</small>
        </div>

        <br>

        <div class="form-check">
            <label>Public groups can be joined by anyone.</label><br>
            <input type="checkbox" id="private" name="private" class="form-check-input" checked>
            <label for="private" class="form-check-label">Make this group private</label>
        </div><br>

        <button type="submit" class="btn btn-primary mt-3">Create Group</button>
    </form>
</div>

<script>
    const reservedOperatorNameFallbackMessage = 'This operator name is reserved, if you think this is a mistake please open a ticket via discord or on the site';

    async function checkReservedOperatorName(name) {
        const params = new URLSearchParams({ operator_name: name });
        const response = await fetch(`/operator/reserved-name/check/?${params.toString()}`);
        if (!response.ok) {
            return { reserved: false, message: '' };
        }
        const data = await response.json();
        return {
            reserved: Boolean(data.reserved),
            message: data.message || reservedOperatorNameFallbackMessage,
        };
    }

    document.getElementById('group-form').addEventListener('submit', async function(event) {
        if (this.dataset.reservedNameChecked === 'true') {
            return;
        }

        const groupNameField = document.getElementById('group_name');
        const groupName = groupNameField.value.trim();
        if (!groupName) {
            return;
        }

        event.preventDefault();

        const reservedNameResult = await checkReservedOperatorName(groupName);
        if (reservedNameResult.reserved) {
            groupNameField.style.border = '2px solid red';
            alert(reservedNameResult.message);
            return;
        }

        this.dataset.reservedNameChecked = 'true';
        this.requestSubmit();
    });
</script>
{% endblock %}
