{% extends 'mbtbase.html' %}
{% load static %}
{% load url_filters %}

{% block title %}Trip Map{% endblock %}
{% block extra_css %}
<link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, main {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  #map {
    position: fixed !important;
    top: 55px;
    bottom: 0;
    width: 100%;
    left: 0;
  }

  .trip-map-control {
    position: fixed;
    left: 10px;
    z-index: 1000;
    background: var(--brand-color);
    color: var(--text-color);
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #routeToggle {
    bottom: 10px;
  }

  #stopsToggle {
    bottom: 50px;
  }

  #historyToggle {
    bottom: 90px;
  }

  #trackingStatus {
    background: rgba(20, 20, 20, 0.86);
    border-radius: 4px;
    color: #fff;
    display: none;
    font-size: 13px;
    left: 10px;
    max-width: min(340px, calc(100vw - 20px));
    padding: 8px 10px;
    position: fixed;
    top: 65px;
    z-index: 1000;
  }

  .vehicle-marker {
    text-align: center;
    color: #000;
    fill: currentColor;
    text-anchor: middle;
    paint-order: stroke;
    stroke-width: 2px;
    line-height: 16px;
    z-index: 20;
  }

  .history-marker {
    align-items: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
    pointer-events: auto;
    transform-origin: center center;
  }

  .history-arrow {
    color: var(--map-tracking-trail-colour, #111);
    filter: drop-shadow(0 1px 1px rgba(255,255,255,0.95));
    height: 18px;
    width: 18px;
  }

  .history-time {
    background: rgba(255, 255, 255, 0.86);
    border-radius: 3px;
    color: #333;
    display: none;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 2px 4px;
    text-shadow: 0 1px 0 #fff;
    white-space: nowrap;
  }

  .history-marker:hover .history-time,
  .history-marker:focus-within .history-time {
    display: inline-block;
  }

  .maplibregl-popup-tip,
  .maplibregl-popup-content {
    background: var(--background-color) !important;
    color: var(--text-color) !important;
    border-radius: 0.5em !important;
    font-size: 12px !important;
  }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>
{% endblock %}

{% block content %}
<button id="historyToggle" class="trip-map-control">Hide Tracking</button>
<button id="stopsToggle" class="trip-map-control">Hide Stops</button>
<button id="routeToggle" class="trip-map-control">Hide Route</button>
<div id="trackingStatus" role="status"></div>
{% include "partials/map_theme_selector.html" %}
<div id="map"></div>

<script>
  const savedView = JSON.parse(localStorage.getItem('mbt_map_view') || 'null');
  const tripId = "{{ trip.trip_id }}";   // ensure string interpolation
  const vehicleId = "{{ trip.trip_vehicle.id|default:'' }}";
  const trackingPoints = JSON.parse('{{ tracking_points_json|escapejs }}');
  const trackingLatest = JSON.parse('{{ tracking_latest_json|escapejs }}');
  const tripVehicle = JSON.parse('{{ trip_vehicle_json|escapejs }}');
  const tripRouteNum = "{{ trip.trip_route_num|default:trip.trip_route.route_num|default:''|escapejs }}";
  let btMarkers = [];
  let fallbackVehicleMarker = null;
  let trackingHistoryMarkers = [];
  let btVehicleData = []; // Store vehicle data to re-render on zoom change
  const DETAIL_ZOOM_THRESHOLD = 10; // Zoom level to switch between circle and full icon
  let currentDirection = "inbound";
  let showRoute = false;
  let showStops = true;
  let showTracking = true;

  const tilesJSON = getInitialMapStyle();
  document.documentElement.style.setProperty('--map-tracking-trail-colour', getInitialMapTrailColour());

  function trackingTrailColour() {
    return getInitialMapTrailColour();
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: tilesJSON,
    center: savedView?.center || [-2.5, 54.5],
    zoom: savedView?.zoom || 5,
    dragRotate: false
  });
  window.tripMap = map;

  map.on('style.load', () => {
    map.setProjection({
      type: 'globe'
    });
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-left');
  addMapThemeControl(map);

  function createLiveryIcon({ label = '', rotation = 0, bg = '#0000', css = null, isColour = false, textColour = '#fff', textStroke = "#0000", strokeWidth = "0px", carriages = 1 } = {}) {
      const normalisedRotation = ((rotation % 360) + 360) % 360;
      const cellRotation = (normalisedRotation < 90 || normalisedRotation > 270) ? 0 : 180;
      const backgroundStyle = css ? `background: ${css};` : `background: ${bg};`;
      const html = document.createElement('div');
      
      // Ensure carriages is at least 1
      const numCarriages = Math.min(16, Math.max(1, parseInt(carriages) || 1));
      let localTextColour = textColour;
      let localTextStroke = textStroke;
      if (isColour) {
        localTextColour = '#000';
        localTextStroke = '#fff';
        strokeWidth = "2px";
      }
      
      // Build carriage SVGs - last carriage (front) has label, rest are empty
      let carriageSvgs = '';
      for (let i = 0; i < numCarriages; i++) {
        const isLastCarriage = i === numCarriages - 1;
        const carriageLabel = isLastCarriage ? label : '';
        carriageSvgs += `
          <svg width="24" height="16" class="vehicle-marker" style="stroke: ${localTextStroke}; text-align: center; ${backgroundStyle} transform: rotate(${cellRotation}deg); border: 1px solid rgba(0,0,0); color: ${localTextColour}; fill: ${localTextColour}; stroke-width: ${strokeWidth}; ${i > 0 ? 'margin-left: 3px;' : ''}">
            <text x="12" y="12">${carriageLabel}</text>
          </svg>
        `;
      }
      
      html.innerHTML = `
        <div style="display:inline-flex; transform: rotate(${rotation}deg); align-items: center;">
          ${carriageSvgs}
          <span style="display:flex; margin-left: -8px; color:black;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 6.65v10.69c0 .64.76.99 1.24.56l6.11-5.35c.34-.3.34-.83 0-1.13L9.24 6.07C8.76 5.65 8 5.99 8 6.63Z" />
            </svg>
          </span>
        </div>
      `;

      return html;
    }

  function createSimpleCircle({ colour = '#000', borderColour = '#000' } = {}) {
    const el = document.createElement('div');
    el.style.cssText = `width: 10px; height: 10px; background: ${colour}; border-radius: 50%;`;
    return el;
  }

  async function loadOperatorBT() {
    const b = map.getBounds();

    const q = new URLSearchParams({
      ymax: b.getNorth(),
      ymin: b.getSouth(),
      xmax: b.getEast(),
      xmin: b.getWest(),
      vehicle_id: vehicleId,
    });

    const url = `/api/trips/simulated_positions/?${q}&limit=5000`;

    const res = await fetch(url);
    const data = await res.json();
    btVehicleData = Array.isArray(data.results) ? data.results : [];

    renderBTMarkers();
    renderFallbackVehicleMarker();
  }

  function renderBTMarkers() {
    btMarkers.forEach(m => m.remove());
    btMarkers = [];

    const zoom = map.getZoom();
    const showDetailedIcon = zoom >= DETAIL_ZOOM_THRESHOLD;

    for (const v of btVehicleData) {
      const lat = v.lat;
      const lng = v.lng;
      if (!lat || !lng) continue;

      let heading = (v.heading ?? 0) + 180;
      const line = v.service?.line_name || "";
      const dest = v.destination || "";
      const serviceLink = v.service?.url || "";
      const vehicleLink = v.vehicle?.url || "";
      const vehicleColour = v.vehicle?.colour || '#000';

      // livery logic (copied from your working page)
      const css = v.vehicle?.css || v.vehicle?.left_css || "#fff";
      let textColour = v.vehicle?.text_colour || (v.vehicle?.white_text ? "#fff" : "#000");
      const textStroke = v.vehicle?.stroke_colour ?? false;
      const strokeWidth = textStroke ? "2px" : "0px";
      const livery = v.vehicle?.livery || null;
      
      if (livery == null) {
        textColour = '#000';
      }

      // Stroke logic: treat plain-colour liveries as colour-only vehicles
      let isColour = false;
      if (vehicleColour && v.vehicle?.livery && v.vehicle?.livery.left_css == '' && v.vehicle?.livery.right_css == '') {
        isColour = true;
      }
      
      heading = heading + 90;

      // Parse custom_features for carriages
      let carriages = 1;
      const customFeatures = v.vehicle?.custom_features;
      if (customFeatures) {
        try {
          let features = customFeatures;
          if (typeof customFeatures === 'string') {
            // Try parsing as-is first (in case it's already valid JSON)
            try {
              features = JSON.parse(customFeatures);
            } catch {
              // Fallback: only replace quotes if it looks like Python dict notation
              // This is still fragile but slightly better
              features = JSON.parse(customFeatures.replace(/'/g, '"'));
            }
          }
          if (features && features.carriages) {
            carriages = parseInt(features.carriages) || 1;
          }
        } catch (e) {
          console.warn('Failed to parse custom_features:', customFeatures, e);
        }
      }

      let el;
      if (showDetailedIcon) {
        // Only show multiple carriages when zoomed in past level 12
        const displayCarriages = zoom > 12 ? carriages : 1;
        el = createLiveryIcon({
          label: line,
          css,
          isColour,
          textColour,
          rotation: heading,
          textStroke,
          strokeWidth,
          carriages: displayCarriages
        });
      } else {
        el = createSimpleCircle({ colour: vehicleColour, borderColour: '#333' });
      }

      const veh = v.vehicle || {};

      const m = new maplibregl.Marker({ element: el })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup({ offset: 6 }).setHTML(`
          <a href="${serviceLink}">${line} to ${dest}</a><br>
          ${vehicleLink ? `<a href="${vehicleLink}">${veh.name || ''}</a>` : ""}<br>
          <span class="time-ago" data-time="${v.updated_at}">${timeAgo(v.updated_at)}</span>
          <small style="margin-bottom: 0;">Simulated Location</small>
        `))
        .addTo(map);

      btMarkers.push(m);
    }
  }

  function createTrackingVehicleMarker(point) {
    const heading = (Number.isFinite(parseFloat(point.heading)) ? parseFloat(point.heading) : 0) + 270;
    const vehicleColour = tripVehicle.colour || '#000';
    const css = tripVehicle.css || tripVehicle.left_css || '#fff';
    let textColour = tripVehicle.text_colour || (tripVehicle.white_text ? '#fff' : '#000');
    const textStroke = tripVehicle.stroke_colour ?? false;
    const strokeWidth = textStroke ? '2px' : '0px';
    const livery = tripVehicle.livery || null;
    if (livery == null) {
      textColour = '#000';
    }

    let isColour = false;
    if (vehicleColour && livery && livery.left_css == '' && livery.right_css == '') {
      isColour = true;
    }

    let carriages = 1;
    const customFeatures = tripVehicle.custom_features;
    if (customFeatures) {
      try {
        let features = customFeatures;
        if (typeof customFeatures === 'string') {
          features = JSON.parse(customFeatures);
        }
        if (features && features.carriages) {
          carriages = parseInt(features.carriages) || 1;
        }
      } catch (error) {
        console.warn('Failed to parse fallback vehicle custom_features:', customFeatures, error);
      }
    }

    const el = createLiveryIcon({
      label: tripRouteNum,
      css,
      isColour,
      textColour,
      rotation: heading,
      textStroke,
      strokeWidth,
      carriages: map.getZoom() > 12 ? carriages : 1
    });
    el.classList.add('tracking-vehicle-marker');
    el.title = point.timestamp ? `Last tracked: ${formatTrackingTime(point.timestamp)}` : 'Last tracked position';
    return el;
  }

  function currentTrackingPoint() {
    const latestPoints = normaliseTrackingPoints([trackingLatest]);
    if (latestPoints.length) return latestPoints[0];
    const historyPoints = normaliseTrackingPoints(trackingPoints);
    return historyPoints[historyPoints.length - 1] || null;
  }

  function renderFallbackVehicleMarker() {
    if (fallbackVehicleMarker) {
      fallbackVehicleMarker.remove();
      fallbackVehicleMarker = null;
    }
    if (btVehicleData.length) return;

    const point = currentTrackingPoint();
    if (!point) return;

    fallbackVehicleMarker = new maplibregl.Marker({
      element: createTrackingVehicleMarker(point),
      anchor: 'center'
    }).setLngLat([point.lng, point.lat]).addTo(map);
  }

  let markers = [];
  const routeLayerId = 'routeLine';
  const trackingLineLayerId = 'trackingLine';
  const trackingLineSourceId = 'trackingLine';

  function setTrackingStatus(message) {
    const status = document.getElementById('trackingStatus');
    if (!status) return;
    status.textContent = message || '';
    status.style.display = message ? 'block' : 'none';
  }

  function setLayerVisibility(layerId, visible) {
    if (map.getLayer(layerId)) {
      map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
    }
  }

  function upsertLineLayerWhenReady({ sourceId, layerId, coordinates, paint, attempts = 30 }) {
    if (!coordinates || coordinates.length < 2) return;

    const draw = (remainingAttempts) => {
      try {
        if (map.getLayer(layerId)) map.removeLayer(layerId);
        if (map.getSource(sourceId)) map.removeSource(sourceId);

        map.addSource(sourceId, {
          type: 'geojson',
          data: {
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates
            }
          }
        });
        map.addLayer({
          id: layerId,
          type: 'line',
          source: sourceId,
          paint
        });
        syncTripMapVisibility();
      } catch (error) {
        if (remainingAttempts > 0) {
          setTimeout(() => draw(remainingAttempts - 1), 250);
        } else {
          console.warn(`${layerId} could not be drawn:`, error);
        }
      }
    };

    draw(attempts);
    map.once('style.load', () => draw(attempts));
  }

  function syncTripMapVisibility() {
    setLayerVisibility(routeLayerId, showRoute);
    setLayerVisibility(trackingLineLayerId, showTracking);
    markers.forEach(marker => {
      marker.getElement().style.display = showStops ? '' : 'none';
    });
    trackingHistoryMarkers.forEach(marker => {
      marker.getElement().style.display = showTracking ? '' : 'none';
    });
    if (fallbackVehicleMarker) {
      fallbackVehicleMarker.getElement().style.display = showTracking ? '' : 'none';
    }
    document.getElementById('routeToggle').textContent = showRoute ? 'Hide Route' : 'Show Route';
    document.getElementById('stopsToggle').textContent = showStops ? 'Hide Stops' : 'Show Stops';
    document.getElementById('historyToggle').textContent = showTracking ? 'Hide Tracking' : 'Show Tracking';
  }

  async function loadTrip(tripId) {
    // Fetch trip data
    const res = await fetch(`/api/trips/${tripId}/`);
    if (!res.ok) {
      alert("Failed to load trip data");
      return;
    }
    const tripData = await res.json();
    console.log("Trip data:", tripData);

    const routeId = tripData.trip_route;   // use trip_route field
    currentDirection = tripData.direction || currentDirection;

    // Fetch route geometry
    const routeRes = await fetch(`/api/routes/${routeId}/stops/?direction=${currentDirection}`);
    if (!routeRes.ok) {
      alert("Failed to load route stops");
      return;
    }
    const data = await routeRes.json();

    // Clear old markers/layers
    for (const m of markers) m.remove();
    markers = [];
    if (map.getLayer(routeLayerId)) map.removeLayer(routeLayerId);
    if (map.getSource(routeLayerId)) map.removeSource(routeLayerId);
    clearTrackingHistory();

    const hasSnapped = data.has_snapped_route === true;
    const stops = data.stops || [];
    const snapped = data.snapped_route || [];

    const stopCoords = stops
      .map(stop => stop.cords?.split(',').map(Number))
      .filter(c => c && c.length === 2 && !isNaN(c[0]) && !isNaN(c[1]))
      .map(([lat, lon]) => [lon, lat]);

    let geometryToDraw = hasSnapped && snapped.length > 1 ? snapped : stopCoords;

    const bounds = new maplibregl.LngLatBounds();

    if (geometryToDraw.length >= 2) {
      upsertLineLayerWhenReady({
        sourceId: routeLayerId,
        layerId: routeLayerId,
        coordinates: geometryToDraw,
        paint: { 'line-color': '#2f80ed', 'line-width': 3 }
      });
      geometryToDraw.forEach(c => bounds.extend(c));
    }

    // Add stop markers
    for (const stop of stops) {
      const [lat, lon] = stop.cords.split(',').map(Number);
      if (isNaN(lat) || isNaN(lon)) continue;
      const el = document.createElement('div');
      el.style.cssText = "width:10px;height:10px;border:3px solid var(--brand-color);border-radius:50%;background:#fff;cursor:pointer;";
      markers.push(new maplibregl.Marker({ element: el })
        .setLngLat([lon, lat])
        .setPopup(new maplibregl.Popup({ offset: 6 }).setHTML(`<a href="/stop/?name=${encodeURIComponent(stop.stop)}">${stop.stop}</a>`))
        .addTo(map));
    }

    const historyCoords = renderTrackingHistory(trackingPoints);
    historyCoords.forEach(coord => bounds.extend(coord));
    const fallbackPoint = currentTrackingPoint();
    if (fallbackPoint) {
      bounds.extend([fallbackPoint.lng, fallbackPoint.lat]);
      renderFallbackVehicleMarker();
    }

    if (!bounds.isEmpty()) {
      map.fitBounds(bounds, { padding: 60 });
    }
    syncTripMapVisibility();
  }

  function clearTrackingHistory() {
    trackingHistoryMarkers.forEach(marker => marker.remove());
    trackingHistoryMarkers = [];
    if (map.getLayer(trackingLineLayerId)) map.removeLayer(trackingLineLayerId);
    if (map.getSource(trackingLineSourceId)) map.removeSource(trackingLineSourceId);
  }

  function normaliseTrackingPoints(points) {
    let sourcePoints = points || [];
    if (typeof sourcePoints === 'string') {
      try {
        sourcePoints = JSON.parse(sourcePoints);
      } catch (error) {
        console.warn('Tracking history is not valid JSON:', error);
        return [];
      }
    }
    if (!Array.isArray(sourcePoints)) return [];

    return sourcePoints
      .map(point => {
        const lat = parseFloat(point.X ?? point.lat ?? point.latitude);
        const lng = parseFloat(point.Y ?? point.lng ?? point.lon ?? point.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || (lat === 0 && lng === 0)) return null;
        return {
          lat,
          lng,
          heading: Number.isFinite(parseFloat(point.heading)) ? parseFloat(point.heading) : null,
          timestamp: point.timestamp || point.time || point.updated_at || null,
        };
      })
      .filter(Boolean);
  }

  function sampleTrackingPoints(points, maxPoints = 200) {
    if (points.length <= maxPoints) return points;
    const step = Math.ceil(points.length / maxPoints);
    const sampled = points.filter((_, index) => index % step === 0);
    const last = points[points.length - 1];
    if (sampled[sampled.length - 1] !== last) sampled.push(last);
    return sampled;
  }

  function bearingBetween(from, to) {
    if (!from || !to) return 0;
    const lat1 = from.lat * Math.PI / 180;
    const lat2 = to.lat * Math.PI / 180;
    const deltaLng = (to.lng - from.lng) * Math.PI / 180;
    const y = Math.sin(deltaLng) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLng);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function formatTrackingTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function createHistoryMarker(point, heading) {
    const el = document.createElement('div');
    el.className = 'history-marker';
    const time = formatTrackingTime(point.timestamp);
    el.innerHTML = `
      ${time ? `<span class="history-time">${time}</span>` : ''}
      <svg class="history-arrow" viewBox="0 0 24 24" style="transform: rotate(${heading}deg);">
        <path fill="currentColor" d="M12 2 5.5 21 12 17.4 18.5 21 12 2Z"></path>
      </svg>
    `;
    if (time) {
      el.title = time;
    }
    return el;
  }

  function renderTrackingHistory(rawPoints) {
    const points = normaliseTrackingPoints(rawPoints);
    if (!points.length) {
      setTrackingStatus('No tracking trail was recorded for this trip.');
      const historyToggle = document.getElementById('historyToggle');
      if (historyToggle) {
        historyToggle.textContent = 'No Tracking Trail';
        historyToggle.disabled = true;
        historyToggle.style.opacity = '0.7';
        historyToggle.style.cursor = 'not-allowed';
      }
      return [];
    }
    setTrackingStatus('');

    const coords = points.map(point => [point.lng, point.lat]);

    if (coords.length >= 2) {
      upsertLineLayerWhenReady({
        sourceId: trackingLineSourceId,
        layerId: trackingLineLayerId,
        coordinates: coords,
        paint: {
          'line-color': trackingTrailColour(),
          'line-width': 2,
          'line-opacity': 0.65,
          'line-dasharray': [2, 2]
        }
      });
    }

    const markerPoints = sampleTrackingPoints(points);

    markerPoints.forEach((point, index) => {
      const next = markerPoints[index + 1];
      const previous = markerPoints[index - 1];
      const heading = point.heading ?? bearingBetween(previous || point, next || point);
      const marker = new maplibregl.Marker({
        element: createHistoryMarker(point, heading),
        anchor: 'center'
      }).setLngLat([point.lng, point.lat]).addTo(map);
      trackingHistoryMarkers.push(marker);
    });

    syncTripMapVisibility();

    return coords;
  }

  document.getElementById('routeToggle').addEventListener('click', () => {
    showRoute = !showRoute;
    syncTripMapVisibility();
  });

  document.getElementById('stopsToggle').addEventListener('click', () => {
    showStops = !showStops;
    syncTripMapVisibility();
  });

  document.getElementById('historyToggle').addEventListener('click', () => {
    showTracking = !showTracking;
    syncTripMapVisibility();
  });

  let tripMapInitialised = false;

  async function initialiseTripMap() {
    if (tripMapInitialised) return;
    tripMapInitialised = true;
    loadOperatorBT().catch(error => {
      console.warn('Live vehicle marker could not be loaded:', error);
    });
    await loadTrip(tripId);
  }

  if (map.loaded()) {
    initialiseTripMap();
  } else {
    map.on('load', initialiseTripMap);
  }
  setTimeout(initialiseTripMap, 1500);
  map.on("moveend", loadOperatorBT);
setInterval(loadOperatorBT, 30000);

// Re-render BT markers when zooming past the threshold (without re-fetching data)
let lastZoomLevel = map.getZoom();
map.on('zoom', () => {
  const currentZoom = map.getZoom();
  const crossedThreshold = 
    (lastZoomLevel < DETAIL_ZOOM_THRESHOLD && currentZoom >= DETAIL_ZOOM_THRESHOLD) ||
    (lastZoomLevel >= DETAIL_ZOOM_THRESHOLD && currentZoom < DETAIL_ZOOM_THRESHOLD);
  
  if (crossedThreshold && btVehicleData.length > 0) {
    renderBTMarkers();
  }
  lastZoomLevel = currentZoom;
});

function timeAgo(dateString) {
    if (!dateString) return '';
    const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
    if (seconds < 60) return `${seconds} sec${seconds !== 1 ? 's' : ''} ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes} min${minutes !== 1 ? 's' : ''} ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} hr${hours !== 1 ? 's' : ''} ago`;
    const days = Math.floor(hours / 24);
    return `${days} day${days !== 1 ? 's' : ''} ago`;
  }

setInterval(() => {
    document.querySelectorAll('.time-ago').forEach(el => {
      const dateString = el.dataset.time;
      if (dateString) {
        el.textContent = timeAgo(dateString);
      }
    });
  }, 1000); 
</script>
