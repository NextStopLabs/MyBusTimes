<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Menu toggle
    const menuToggle = document.getElementById('menu-toggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function () {
      const navMenu = document.getElementById('nav-menu');
        if (!navMenu) return;
        if (navMenu.style.display === 'none' || navMenu.style.display === '') {
          navMenu.style.display = 'block';
        } else {
          navMenu.style.display = 'none';
        }
      });
    }

    function saveTheme(themeId, darkMode) {
      return fetch("{% url 'set_theme' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': '{{ csrf_token }}',
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
          theme_id: themeId,
          darkMode: darkMode
        }),
      })
      .then(response => response.json())
      .then(() => window.location.reload())
      .catch(err => alert(err.message));
    }

    function selectedThemeId() {
      const themeSelector = document.getElementById('theme-selector');
      const themeInput = document.querySelector('input[name="theme_id"]');
      return themeSelector?.value || themeInput?.value || '';
    }

    function selectedDarkMode() {
      const darkModeToggle = document.getElementById('dark-mode-toggle');
      const suggestedDarkMode = document.getElementById('suggested-dark-mode');
      if (darkModeToggle) {
        return darkModeToggle.checked;
      }
      return suggestedDarkMode?.value || false;
    }

    const usersStats = document.getElementById('users-stats');
    if (usersStats && usersStats.dataset.siteCountsUrl) {
      fetch(usersStats.dataset.siteCountsUrl, { headers: { 'Accept': 'application/json' } })
        .then(response => response.ok ? response.json() : null)
        .then(data => {
          if (!data) return;
          usersStats.textContent = `Online: ${data.online_users_count} | Total: ${data.total_users_count}`;
        })
        .catch(() => {
          usersStats.textContent = '';
        });
    }

    // Theme selector
    const themeSelector = document.getElementById('theme-selector');
    if (themeSelector) {
      themeSelector.addEventListener('change', function () {
      const themeId = this.value;
        saveTheme(themeId, selectedDarkMode());
      });
    }

    const darkModeToggle = document.getElementById('dark-mode-toggle');
    if (darkModeToggle) {
      darkModeToggle.addEventListener('change', function () {
      const darkMode = this.checked;
        saveTheme(selectedThemeId(), darkMode);
      });
    }

    const tryItNow = document.getElementById('tryitnow');
    if (tryItNow) {
      tryItNow.addEventListener('click', function (event) {
      event.preventDefault();
        saveTheme(selectedThemeId(), selectedDarkMode());
      });
    }

    // Unban timer
    const timerEl = document.getElementById("unban-timer");
    if (timerEl) {
      const unbanDateStr = timerEl.dataset.unban;
      const unbanDate = new Date(unbanDateStr);

      function updateCountdown() {
        const now = new Date();
        const diff = unbanDate - now;

        if (diff <= 0) {
          timerEl.textContent = "You are unbanned!";
          clearInterval(timer);
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        let text = "";
        if (days > 0) text += days + "d ";
        text += hours.toString().padStart(2, "0") + "h ";
        text += minutes.toString().padStart(2, "0") + "m ";
        text += seconds.toString().padStart(2, "0") + "s";

        timerEl.textContent = text;
      }

      updateCountdown();
      const timer = setInterval(updateCountdown, 1000);
    }
  });
</script>
