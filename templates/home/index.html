{{define "title"}}Home - MyBusTimes{{end}}
{{define "width"}}narrow{{end}}

{{define "content"}}
<h2>Search</h2>
<p>Search for operators or routes</p>
<div class="homeSearch">
    <form action="search">
        <input type="search" name="q" id="q" placeholder="Search">
        <input type="submit" value="Search">
    </form>
</div>

<p>Note: MyBusTimes is 100% fictional. All data shown here is user generated and not real world data <a href="/about">more info.</a> </p>

<h2>Message of The Day</h2>
<p id="modt">...</p>
<script>
    fetch('/api/motd')
        .then(response => response.json())
        .then(data => {
            document.getElementById('modt').innerText = data.message;
            console.log('MODT fetched:', data);
        })
        .catch(error => {
            console.error('Error fetching MODT:', error);
            document.getElementById('modt').innerText = 'Oops! Well guess there is no message for today.';
        });
</script>

<div class="incontent-ad-container ad" style="height:100px;">
	<div id="AFM_inContent_ad" style="margin:auto;"></div>
</div>

<div id="regions-container">
    <!-- Regions will be populated from /api/regions. Static markup left as fallback will be replaced when JS runs. -->
</div>

<script>
fetch('/api/regions')
    .then(r => {
        if (!r.ok) throw new Error('failed to fetch regions');
        return r.json();
    })
    .then(data => {
        const container = document.getElementById('regions-container');
        if (!data || !data.regions) return;
        container.innerHTML = '';
        data.regions.forEach(region => {
            const div = document.createElement('div');
            const h2 = document.createElement('h2');
            h2.textContent = region.name;
            div.appendChild(h2);
            const ul = document.createElement('ul');
            const countries = region.countries || {};
            Object.keys(countries).forEach(code => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '/region/' + code.toUpperCase();
                a.textContent = countries[code];
                li.appendChild(a);
                ul.appendChild(li);
            });
            div.appendChild(ul);
            container.appendChild(div);
        });
    })
    .catch(err => {
        console.error('Could not load regions from API, keeping static content:', err);
    });
</script>
{{end}}
